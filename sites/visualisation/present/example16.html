        <article>

            <h3>Example 16: DataAnalysis Plugin</h3>
            <p>This shows the application of the DataAnalysis Plugin for simple dataanalysis tools.</p>

            <div id="present_example16" swa="Present FROM ../../../data/visualisation/present/example16/data.json TEMPLATE table_for_all_datasets"></div>
            
            <fieldset>
                <legend>VIEW-Requestor</legend>
                <div id="present_example16_html" swa="Coder FROM #present_example16"></div>
            </fieldset>
            <fieldset>
                <legend>CONFIGURATION</legend>
                <div id="present_example16_conf" swa="Coder FROM ../../../js/visualisation/present/example16.js"></div>
            </fieldset>
            <fieldset>
                <legend>DATASOURCE</legend>
                <div id="present_example16_datasource" swa="Coder FROM ../../../data/visualisation/present/example16/data.json"></div>
            </fieldset>
        </article>
